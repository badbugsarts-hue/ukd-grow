name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Reproducible release package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "${expected}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}." >&2
            exit 1
          }
      - name: Build and generate release evidence
        run: pnpm build && pnpm test:budget && pnpm release:metadata
      - name: Package static application
        shell: bash
        run: |
          tar -C dist -czf "artifacts/ukd-grow-${GITHUB_REF_NAME}.tar.gz" .
          (cd dist && zip -qr "../artifacts/ukd-grow-${GITHUB_REF_NAME}.zip" .)
          sha256sum artifacts/ukd-grow-* artifacts/ukd-sbom.spdx.json artifacts/ukd-provenance.json artifacts/license-audit.json > artifacts/SHA256SUMS.txt
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ukd-grow-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --verify-tag \
              --title "UKD Grow ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
