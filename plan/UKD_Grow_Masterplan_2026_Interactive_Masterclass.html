function linkify(v){const s=String(v??'');if(/^https?:\/\//.test(s))return `<a href="${e(s)}" target="_blank" rel="noopener">${e(s.replace(/^https?:\/\//,''))}</a>`;if(s.includes('http'))return e(s).replace(/https?:\/\/[^\s;]+/g,m=>`<a href="${e(m)}" target="_blank" rel="noopener">${e(m)}</a>`);return e(s)}
function objs(sheet,headerRow=0,startRow=1){const rows=DATA[sheet].values,head=rows[headerRow]||[];return rows.slice(startRow).filter(r=>r.some(x=>x!==null&&x!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h??`_${i}`,r[i]])))}
function rowByDay(day){return DATA['02_Daily_Master'].values[day+1]||DATA['02_Daily_Master'].values[1]}
const DH=DATA['02_Daily_Master'].values[0];
function dval(row,label){const i=DH.indexOf(label);return i>=0?row[i]:null}
function configMap(){const rows=DATA['01_Run_Config'].values,m={};for(const r of rows){if(r[0]!=null&&r[1]!=null)m[String(r[0])]=r[1]}return m}const CFG=configMap();state.day=Number(CFG['Aktueller Run-Tag']||0);
function currentStatus(){const log=DATA['12_Daily_Log'].values[state.day+1];return log?.[24]||'OFFEN'}
function phaseClass(p=''){p=String(p).toLowerCase();if(p.includes('keim')||p.includes('etabl'))return'phase-keim';if(p.includes('veg')||p.includes('preflower'))return'phase-veg';if(p.includes('flower')||p.includes('stretch')||p.includes('ripen'))return'phase-flow';return'phase-harvest'}
function badge(t,cls=''){return `<span class="pill ${cls}">${e(t)}</span>`}
function metric(label,value,sub='',tone='blue'){return `<div class="card metric ${tone}"><div class="label">${e(label)}</div><div class="value">${e(value)}</div><div class="sub">${e(sub)}</div></div>`}
function section(title,body,right=''){return `<section class="section"><div class="sectionhead"><h3>${e(title)}</h3>${right}</div>${body}</section>`}
function callout(title,text,type='warn'){return `<div class="callout ${type}"><div>${type==='danger'?'⚠':type==='good'?'✓':'ⓘ'}</div><div><strong>${e(title)}</strong><div>${linkify(text)}</div></div></div>`}
function kv(items){return `<div class="kv">${items.map(([k,v])=>`<div class="k">${e(k)}</div><div class="v">${linkify(v)}</div>`).join('')}</div>`}
function spark(values,{w=700,h=220,color='line1'}={}){const clean=values.map((v,i)=>[i,Number(v)]).filter(x=>Number.isFinite(x[1]));if(clean.length<2)return '<div class="empty">Keine Chart-Daten</div>';const mn=Math.min(...clean.map(x=>x[1])),mx=Math.max(...clean.map(x=>x[1]));const pad=30,dx=(w-2*pad)/(clean.length-1),scale=(h-2*pad)/(mx-mn||1);const pts=clean.map(([i,v])=>`${pad+i*dx},${h-pad-(v-mn)*scale}`).join(' ');let grids='';for(let j=0;j<4;j++){const y=pad+j*(h-2*pad)/3;grids+=`<line class="gridline" x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}"/>`}return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img"><g>${grids}</g><polyline class="${color}" points="${pts}"/><text x="${pad}" y="${h-7}">${clean[0][0]}</text><text x="${w-pad-18}" y="${h-7}">${clean.at(-1)[0]}</text><text x="4" y="${pad+4}">${mx.toLocaleString('de-DE',{maximumFractionDigits:1})}</text><text x="4" y="${h-pad}">${mn.toLocaleString('de-DE',{maximumFractionDigits:1})}</text></svg></div>`}
function dualSpark(a,b){const w=700,h=230,pad=30;const A=a.map((v,i)=>[i,Number(v)]).filter(x=>Number.isFinite(x[1])),B=b.map((v,i)=>[i,Number(v)]).filter(x=>Number.isFinite(x[1]));if(!A.length||!B.length)return'';const all=[...A,...B].map(x=>x[1]),mn=Math.min(...all),mx=Math.max(...all),n=Math.max(A.length,B.length),dx=(w-2*pad)/(n-1),sy=(h-2*pad)/(mx-mn||1),points=z=>z.map(([i,v])=>`${pad+i*dx},${h-pad-(v-mn)*sy}`).join(' ');return `<div class="chart"><svg viewBox="0 0 ${w} ${h}"><polyline class="line1" points="${points(A)}"/><polyline class="line2" points="${points(B)}"/><text x="${pad}" y="18" style="fill:var(--blue)">Serie 1</text><text x="${pad+65}" y="18" style="fill:var(--teal)">Serie 2</text></svg></div>`}
function table(headers,rows,opts={}){const max=opts.max??rows.length, r=rows.slice(0,max);return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map((h,i)=>`<th class="${i===0?'stickycol':''}">${e(h??'')}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${headers.map((h,i)=>`<td class="${i===0?'stickycol':''}">${linkify(fmt(Array.isArray(row)?row[i]:row[h],h))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function cardsFromRows(headers,rows,titleKey=0){return `<div class="productcards">${rows.map(r=>`<article class="productcard"><h4>${e(fmt(r[titleKey],headers[titleKey]))}</h4><div class="kv">${headers.map((h,i)=>i===titleKey?'':`<div class="k">${e(h??'')}</div><div class="v">${linkify(fmt(r[i],h))}</div>`).join('')}</div></article>`).join('')}</div>`}

window.ppfdCalc=()=>{const a=[...document.querySelectorAll('.ppfdin')].map(x=>+x.value).filter(Number.isFinite);const o=document.getElementById('ppfdout');if(!o)return;if(a.length!==9){o.innerHTML='<div>ⓘ</div><div><strong>'+a.length+'/9 Werte</strong><div>Bitte alle Messpunkte erfassen.</div></div>';return}const avg=a.reduce((x,y)=>x+y,0)/9,min=Math.min(...a),sd=Math.sqrt(a.reduce((s,x)=>s+(x-avg)**2,0)/(a.length-1)),cv=sd/avg,u=min/avg;o.innerHTML=`<div>✓</div><div><strong>Mittel ${avg.toFixed(0)} · min/avg ${(u*100).toFixed(1)}% · CV ${(cv*100).toFixed(1)}%</strong><div>CV ≤15% ist nur eine UKD-Heuristik, kein universeller Cannabis-Grenzwert.</div></div>`}

function renderProducts(){const v=DATA['17_All_Products'].values,h=v[0],rows=v.slice(1).filter(r=>r[0]&&r[1]);const makers=[...new Set(rows.map(r=>r[0]))].sort(),statuses=[...new Set(rows.map(r=>r[7]).filter(Boolean))].sort();let f=rows.filter(r=>(state.productMaker==='ALL'||r[0]===state.productMaker)&&(state.productStatus==='ALL'||r[7]===state.productStatus)&&(!state.productQuery||r.join(' ').toLowerCase().includes(state.productQuery.toLowerCase())));const controls=`<div class="toolbar"><input class="control" placeholder="Produkt suchen…" value="${e(state.productQuery)}" oninput="state.productQuery=this.value;render()"><select class="control" onchange="state.productMaker=this.value;render()"><option>ALL</option>${makers.map(x=>`<option ${state.productMaker===x?'selected':''}>${e(x)}</option>`).join('')}</select><select class="control" onchange="state.productStatus=this.value;render()"><option>ALL</option>${statuses.map(x=>`<option ${state.productStatus===x?'selected':''}>${e(x)}</option>`).join('')}</select>${badge(`${f.length} Produkte`,'green')}</div>`;return `<div class="hero"><div><div class="eyebrow">Katalog</div><h2>Produkte</h2><p>UKD-relevanter evaluierter Produktkatalog; kein Anspruch auf vollständige globale Hersteller-Inventarliste.</p></div></div>${controls}<div class="producttable">${table(h,f)}</div>${cardsFromRows(h,f,1)}`}

function renderCompat(){const v=DATA['16_Compatibility'].values,headers=v[2].filter(x=>x!=null),rows=v.slice(3).filter(r=>r[0]&&headers.includes(r[0]));const product=state.compatProduct||rows[0]?.[0];const row=rows.find(r=>r[0]===product)||rows[0];const list=headers.slice(1).map((h,i)=>[h,row[i+1]]).filter(x=>x[1]&&x[1]!=='—');const legend='✅ sinnvoll/orthogonal · ◐ bedingt · 🧪 A/B · ↔ Alternative/phasensequentiell · R redundant · ⚠ Überlappung · ✖ nicht gleichzeitig · T Tankwarnung';return `<div class="hero"><div><div class="eyebrow">Entscheidungsmatrix</div><h2>Kompatibilität</h2><p>Reference-Logik, nicht bloße chemische Mischbarkeit.</p></div></div><div class="toolbar"><select class="control sheetselect" onchange="state.compatProduct=this.value;render()">${rows.map(r=>`<option ${r[0]===product?'selected':''}>${e(r[0])}</option>`).join('')}</select><span class="muted">${e(legend)}</span></div><div class="compat">${list.map(([n,c])=>`<div class="compatitem"><span>${e(n)}</span><span class="code" data-code="${e(c)}">${e(c)}</span></div>`).join('')}</div>${section('Vollmatrix',table(headers,rows.map(r=>r.slice(0,headers.length))))}`}

function renderAudit(){const v=DATA['26_Audit_Report'].values,h=v[2].slice(0,10),rows=v.slice(3).filter(r=>/^A\d+/.test(r[0]||''));const sevs=['ALL','KRITISCH','HOCH','MITTEL','NIEDRIG'];const f=rows.filter(r=>state.auditSeverity==='ALL'||r[1]===state.auditSeverity);const counts=Object.fromEntries(sevs.slice(1).map(s=>[s,rows.filter(r=>r[1]===s).length]));return `<div class="hero"><div><div class="eyebrow">Forensik</div><h2>Audit Report</h2><p>Jeder Fund mit Risiko, Korrektur, Evidenz, Restunsicherheit und Priorität.</p></div><div>${badge(`${rows.length} Findings`,'green')} ${badge(`${counts.KRITISCH} kritisch`,'red')}</div></div><div class="toolbar">${sevs.map(s=>`<button class="btn ${state.auditSeverity===s?'active':''}" onclick="state.auditSeverity='${s}';render()">${s}${s==='ALL'?'':` · ${counts[s]}`}</button>`).join('')}</div><div class="list">${f.map(r=>`<article class="card flat"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong>${e(r[0])}</strong><span class="tag severity-${e(r[1])}">${e(r[1])}</span><span class="pill">${e(r[9])}</span><span class="pill green">${e(r[7])}</span></div><h3 style="margin-top:10px">${e(r[3])}</h3><div class="grid g3"><div><b>Risiko</b><div class="muted">${e(r[4])}</div></div><div><b>Korrektur</b><div class="muted">${e(r[5])}</div></div><div><b>Restunsicherheit</b><div class="muted">${e(r[8])}</div></div></div><div style="margin-top:8px"><span class="pill">${e(r[2])}</span> <span class="pill">${e(r[6])}</span></div></article>`).join('')}</div>`}

function renderSources(){const v=DATA['22_Sources'].values,h=v[0],rows=v.slice(1).filter(r=>r.some(Boolean));return `<div class="hero"><div><div class="eyebrow">Nachweise</div><h2>Quellen</h2><p>Quellenliste aus der auditierten Arbeitsmappe. URLs sind direkt anklickbar.</p></div>${badge(`${rows.length} Einträge`,'green')}</div>${table(h,rows)}`}

function rawMatrix(sheet){const vals=DATA[sheet].values,forms=DATA[sheet].formulas||[];let rows=vals.map((r,i)=>({r,i}));if(state.rawHideEmpty)rows=rows.filter(({r,i})=>r.some((x,j)=>(x!==null&&x!=='')||(forms[i]?.[j])));let last=0;for(const {r,i} of rows)for(let j=0;j<Math.max(r.length,forms[i]?.length||0);j++)if((r[j]!==null&&r[j]!=='')||forms[i]?.[j])last=Math.max(last,j+1);last=Math.max(1,last);let html=`<div class="tablewrap"><table class="table"><thead><tr><th>#</th>${Array.from({length:last},(_,i)=>`<th>${colName(i)}</th>`).join('')}</tr></thead><tbody>`;for(const {r,i} of rows){html+=`<tr><td class="stickycol">${i+1}</td>`;for(let j=0;j<last;j++){const v=r[j],f=forms[i]?.[j],id=`cell-${sheet.replace(/[^a-z0-9]/gi,'_')}-${i}-${j}`,hl=state.highlight===`${sheet}!${colName(j)}${i+1}`?' cellhl':'';html+=`<td id="${id}" class="${hl}">${v===null||v===''?'':linkify(fmt(v))}${state.showFormulas&&f?`<div class="formula">ƒx ${e(f)}</div>`:''}</td>`}html+='</tr>'}return html+'</tbody></table></div>'}
function renderRaw(sheet=state.rawSheet||'00_Dashboard'){state.rawSheet=sheet;return `<div class="rawhead"><div class="rawtitle"><div class="eyebrow">Vollständige Spreadsheet-Ebene</div><h2>${e(sheet)}</h2><div class="sheetmeta">${e(DATA[sheet].range)} · Werte + Formeln</div></div><select class="control sheetselect" onchange="state.rawSheet=this.value;state.highlight=null;state.route='raw';render()">${ALL_SHEETS.map(s=>`<option ${s===sheet?'selected':''}>${e(s)}</option>`).join('')}</select></div><div class="toolbar"><button class="btn ${state.showFormulas?'active':''}" onclick="state.showFormulas=!state.showFormulas;render()">ƒx Formeln ${state.showFormulas?'AN':'AUS'}</button><button class="btn ${state.rawHideEmpty?'active':''}" onclick="state.rawHideEmpty=!state.rawHideEmpty;render()">Leerzeilen ${state.rawHideEmpty?'ausblenden':'zeigen'}</button><button class="btn" onclick="window.print()">Drucken</button></div>${rawMatrix(sheet)}`}
function renderSheetSection(sheet,full=true){return `<div class="section"><div class="sectionhead"><h3>${e(sheet)}</h3><button class="btn" onclick="state.rawSheet='${e(sheet)}';go('raw')">Raw + Formeln</button></div>${full?rawMatrix(sheet):''}</div>`}
function renderGenericSheet(sheet){return renderRaw(sheet)}

function renderRoute(){if(state.route==='overview')return renderOverview();if(state.route==='today')return renderToday();if(state.route==='timeline')return renderTimeline();if(state.route==='mix')return renderMix();if(state.route==='climate')return renderClimate();if(state.route==='nutrients')return renderNutrients();if(state.route==='products')return renderProducts();if(state.route==='compat')return renderCompat();if(state.route==='audit')return renderAudit();if(state.route==='sources')return renderSources();if(state.route==='raw')return renderRaw();if(state.route.startsWith('sheet:'))return renderGenericSheet(state.route.slice(6));return renderOverview()}
function routeTitle(){const names={overview:'Übersicht',today:'Heute',timeline:'Timeline',mix:'Mix & pH',climate:'Klima & Licht',nutrients:'Nährstoffe',products:'Produkte',compat:'Kompatibilität',audit:'Audit',sources:'Quellen',raw:'Alle Sheets'};return state.route.startsWith('sheet:')?state.route.slice(6):(names[state.route]||'UKD')}
function navHTML(){return `<div class="brand"><div class="brandmark">UKD</div><div><h1>Grow Masterplan</h1><small>Interactive · Audited 2026</small></div></div>${GROUPS.map(g=>`<div class="navgroup"><div class="navtitle">${e(g.title)}</div>${g.items.map(([r,ic,n])=>`<button class="navbtn ${state.route===r?'active':''}" onclick="go('${r}')"><span class="navicon">${ic}</span><span>${e(n)}</span>${r==='audit'?'<span class="navbadge">46</span>':''}</button>`).join('')}</div>`).join('')}`}
function mobileHTML(){return [['overview','⌂','Home'],['today','◷','Heute'],['mix','⚗','Mix'],['products','▤','Produkte'],['audit','✓','Audit']].map(([r,i,n])=>`<button class="${state.route===r?'active':''}" onclick="go('${r}')"><b>${i}</b><span>${n}</span></button>`).join('')}
function applyTheme(){const dark=state.theme==='dark'||(state.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('themeBtn').textContent=dark?'☀':'☾'}
function cycleTheme(){state.theme=state.theme==='auto'?'light':state.theme==='light'?'dark':'auto';localStorage.setItem('ukd-theme',state.theme);applyTheme()}
function render(){document.getElementById('sidebar').innerHTML=navHTML();document.getElementById('mobilebar').innerHTML=mobileHTML();document.getElementById('crumb').textContent=routeTitle();document.getElementById('appmain').innerHTML=renderRoute();applyTheme();if(state.highlight&&state.route==='raw'){setTimeout(()=>{const [s,addr]=state.highlight.split('!');const m=addr.match(/([A-Z]+)(\d+)/);if(!m)return;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;c--;const id=`cell-${s.replace(/[^a-z0-9]/gi,'_')}-${+m[2]-1}-${c}`;document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})},80)}}
window.go=r=>{state.route=r;document.body.classList.remove('navopen');window.scrollTo({top:0,behavior:'smooth'});render()};window.setDay=(d,fast=false)=>{state.day=Math.max(0,Math.min(80,+d||0));localStorage.setItem('ukd-day',state.day);if(fast){const el=document.querySelector('.daynum');if(el)el.textContent=`Tag ${state.day}`;clearTimeout(window._rr);window._rr=setTimeout(render,60)}else render()};

function makeSearchIndex(){const idx=[];for(const [sheet,obj] of Object.entries(DATA)){const vals=obj.values,forms=obj.formulas||[];for(let i=0;i<vals.length;i++)for(let j=0;j<Math.max(vals[i]?.length||0,forms[i]?.length||0);j++){const v=vals[i]?.[j],f=forms[i]?.[j];if(v!==null&&v!==''&&v!==undefined)idx.push({sheet,addr:`${colName(j)}${i+1}`,text:String(v),low:String(v).toLowerCase()});if(f)idx.push({sheet,addr:`${colName(j)}${i+1}`,text:`ƒx ${f}`,low:String(f).toLowerCase()})}}return idx}const SEARCH_INDEX=makeSearchIndex();
function doSearch(q){const box=document.getElementById('results');q=q.trim().toLowerCase();if(q.length<2){box.classList.remove('show');box.innerHTML='';return}const terms=q.split(/\s+/),hits=[];for(const x of SEARCH_INDEX){if(terms.every(t=>x.low.includes(t))){hits.push(x);if(hits.length>=60)break}}box.innerHTML=hits.length?hits.map(x=>`<div class="searchitem" onclick="openHit('${e(x.sheet)}','${e(x.addr)}')"><div class="where">${e(x.sheet)} · ${e(x.addr)}</div><div class="snippet">${e(x.text.slice(0,190))}</div></div>`).join(''):'<div class="empty">Keine Treffer</div>';box.classList.add('show')}
window.openHit=(sheet,addr)=>{state.rawSheet=sheet;state.highlight=`${sheet}!${addr}`;state.route='raw';document.getElementById('q').value='';document.getElementById('results').classList.remove('show');render()};
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();document.getElementById('q').focus()}if(ev.key==='Escape'){document.getElementById('results').classList.remove('show');document.body.classList.remove('navopen')}});document.addEventListener('click',ev=>{if(!ev.target.closest('.searchwrap'))document.getElementById('results').classList.remove('show')});
const saved=+localStorage.getItem('ukd-day');if(Number.isFinite(saved)&&saved>=0&&saved<=80)state.day=saved;document.getElementById('sidebar').innerHTML=navHTML();render();
</script></body></html>
