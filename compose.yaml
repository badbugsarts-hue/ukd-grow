name: ukd-platform

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${UKD_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ukd_app:${UKD_DB_APP_PASSWORD:?set UKD_DB_APP_PASSWORD}@postgres:5432/ukd
      UKD_PUBLIC_APP_URL: ${UKD_PUBLIC_APP_URL:?set UKD_PUBLIC_APP_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "--filter", "@ukd/api", "worker"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://ukd_app:${UKD_DB_APP_PASSWORD:?set UKD_DB_APP_PASSWORD}@postgres:5432/ukd
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ukd
      POSTGRES_USER: ukd_migrator
      POSTGRES_PASSWORD: ${UKD_DB_MIGRATOR_PASSWORD:?set UKD_DB_MIGRATOR_PASSWORD}
      UKD_DB_APP_PASSWORD: ${UKD_DB_APP_PASSWORD:?set UKD_DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./apps/api/migrations/001_initial.sql:/docker-entrypoint-initdb.d/020-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukd_migrator -d ukd"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${UKD_OBJECT_USER:?set UKD_OBJECT_USER}
      MINIO_ROOT_PASSWORD: ${UKD_OBJECT_PASSWORD:?set UKD_OBJECT_PASSWORD}
    volumes:
      - object-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["local-mail"]
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
